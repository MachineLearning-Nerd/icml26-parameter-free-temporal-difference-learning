[project]
name = "parameter-free-td-reproduction"
version = "0.1.0"
description = "Claim-by-claim reproduction of arXiv:2603.02577"
requires-python = "==3.12.*"
dependencies = [
  "marimo==0.23.14",
  "matplotlib==3.10.3",
  "numpy==2.2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/td_repro"]

[tool.uv]
package = true
